name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package plugin
        env:
          ARCHIVE_NAME: logseq-timestamp-${{ github.ref_name }}.zip
        run: |
          mkdir -p release/logseq-timestamp
          cp -R dist release/logseq-timestamp/
          cp README.md LICENSE package.json icon.svg release/logseq-timestamp/
          cd release
          zip -r "../${ARCHIVE_NAME}" logseq-timestamp

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            logseq-timestamp-${{ github.ref_name }}.zip
            package.json
